name: CI

on:
  push:
    branches: [main, "ship/**", "fix/**", "pr/**", "scratch/**"]
  pull_request:
    branches: [main]

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        # Docs-only = every changed file is Markdown (or under docs/), except
        # KNOWN_INCOMPLETE.md, which the gates read. Anything else, or a diff
        # that cannot be computed, runs the full suite.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$files" ] \
               && ! echo "$files" | grep -v -E '(^docs/|\.md$)' | grep -q . \
               && ! echo "$files" | grep -q -x 'KNOWN_INCOMPLETE.md'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full suite: $code"

  docs-only-detect:
    name: Docs-only change (stub + secret scan)
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make detect

  phase-a:
    name: Phase A gates
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      TEST_MODE: "true"
      PYTHONPATH: ${{ github.workspace }}
      DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -e . --no-deps
          mkdir -p "$DATA_DIR/logs"

      - name: make detect
        run: make detect

      - name: make test-unit
        run: make test-unit

      - name: make test-integration
        run: make test-integration

      - name: make test-e2e
        run: make test-e2e

      - name: make mutation-gate
        run: make mutation-gate

      - name: make compile-domain + generated tests
        run: |
          make compile-domain
          python -m pytest tests/generated/ -v

  readme-fresh-clone:
    # The README's test steps, verbatim, as a public reader runs them: no
    # PYTHONPATH, DATA_DIR or TEST_MODE from the job, a non-root user.
    name: Fresh clone, README steps
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: README five-minute path, then the whole unit suite
        run: |
          python3.11 -m venv .venv
          . .venv/bin/activate
          pip install --require-hashes -r requirements.txt
          pip install -e . --no-deps
          python -m pytest tests/unit/test_supply_chain.py tests/unit/test_challenge_budget.py
          python -m pytest tests/unit

  compose-builds:
    # What `make up` and `make run` start: the compose file is valid with and
    # without the bundled Ollama, and every image builds.
    name: Compose validates, images build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Placeholders: config only interpolates them, nothing is started.
      HIVE_JWT_KEY: placeholder
      AGENT_API_TOKEN: placeholder
      AGENT_SECRET: placeholder
    steps:
      - uses: actions/checkout@v4
      - name: compose config (host Ollama, as make up)
        run: docker compose config --quiet
      - name: compose config (bundled Ollama, as make run)
        run: docker compose --profile bundled-ollama config --quiet
      - name: build every image
        run: docker compose --profile bundled-ollama build

  phase-b-live-e2e:
    name: Phase B live E2E (spec 11.4 step 7)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx (checker dependency)
        run: pip install httpx

      - name: Generate stack credentials
        run: |
          # Per-run throwaway values, still masked: GITHUB_ENV values are not
          # secrets and every later step's env dump printed them in clear.
          jwt=$(openssl rand -hex 32); token=$(openssl rand -hex 32); secret=$(openssl rand -hex 32)
          echo "::add-mask::$jwt"; echo "::add-mask::$token"; echo "::add-mask::$secret"
          {
            echo "HIVE_JWT_KEY=$jwt"
            echo "AGENT_API_TOKEN=$token"
            echo "AGENT_SECRET=$secret"
            echo "AGENT_ID=agent-e2e"
          } >> "$GITHUB_ENV"

      - name: Bring the stack up the owner's way (make up), on the CI stack's own Ollama
        # Same one command as the local stack; the bundled-ollama profile adds
        # the Ollama server CI runs itself, with the model from config/model.env.
        env:
          COMPOSE_PROFILES: bundled-ollama
          OLLAMA_URL: http://ollama:11434
        run: make up

      - name: Run spec 11.4 step 7 (every evidence mission + the refusal)
        env:
          COMPOSE_PROFILES: bundled-ollama
        run: |
          python scripts/live_e2e_check.py \
            --base-url http://localhost:8000 \
            --token "$AGENT_API_TOKEN" \
            --timeout 900

      - name: Stack logs (on failure)
        if: failure()
        env:
          COMPOSE_PROFILES: bundled-ollama
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        env:
          COMPOSE_PROFILES: bundled-ollama
        run: docker compose down -v

  phase-b-verify-airgap:
    name: Phase B verify-airgap (spec 8.7)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: make verify-airgap (--network none container, local Ollama only)
        run: |
          make verify-airgap
