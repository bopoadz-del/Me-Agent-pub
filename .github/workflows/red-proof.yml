name: Red proof

# A pull request's new or changed tests must fail on its base and pass on its
# head (scripts/red_proof.py). Runs for every pull request, whatever branch it
# targets, so stacked PRs are proved against the PR they sit on.
on:
  pull_request:

concurrency:
  group: red-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  red-proof:
    name: Red proof (tests fail on base, pass on head)
    runs-on: ubuntu-latest
    env:
      TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prove the tests red on base, green on head
        run: |
          python scripts/red_proof.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
