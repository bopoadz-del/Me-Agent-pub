[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "self-agent"
version = "1.1.0"
description = "Portable multi-environment AI self-agent V1.1"
requires-python = ">=3.11,<3.12"

[tool.setuptools]
packages = [
    "common",
    "common.models",
    "common.storage",
    "hive",
    "agent",
    "agent.orchestrator",
    "agent.swarm",
    "agent.security",
    "domain_kits",
    "domain_kits.compiler",
]
package-dir = { "domain_kits" = "domain-kits" }
